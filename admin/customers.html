<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Customers — AbideEver™</title>
  <link rel="icon" href="../assets/images/logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body class="bg-canvas min-h-screen">
  <div id="admin-auth-gate" class="hidden min-h-screen flex items-center justify-center p-4"></div>

  <div id="admin-main-content" class="hidden min-h-screen flex flex-col lg:flex-row">
    <aside id="admin-sidebar" class="w-full lg:w-64 bg-brand-deep text-cream flex flex-col shrink-0"></aside>

    <main class="flex-1 p-6 sm:p-8 lg:p-10 space-y-8 overflow-x-hidden">
      <div class="border-b border-border pb-5">
        <p class="text-[11px] uppercase tracking-[0.18em] text-brand font-semibold">Directory</p>
        <h1 class="font-serif text-3xl font-semibold text-ink mt-1">Customers</h1>
      </div>

      <div id="admin-customers-table" class="border border-border bg-surface overflow-x-auto"></div>
    </main>
  </div>

  <script type="module">
    import { mountAdminShell, requireAdminAccess } from '../assets/js/admin.js';
    import { escapeHTML, formatDate } from '../assets/js/utils.js';

    mountAdminShell('customers');

    requireAdminAccess(async (fb) => {
      const { collection, getDocs } = fb.fsMod;
      const snap = await getDocs(collection(fb.db, 'users'));
      const users = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const wrap = document.getElementById('admin-customers-table');

      wrap.innerHTML = users.length
        ? `<table class="w-full text-left text-xs">
            <thead class="border-b border-border bg-canvas text-muted uppercase tracking-wider">
              <tr><th class="p-3.5">Name</th><th class="p-3.5">Email</th><th class="p-3.5">Joined</th><th class="p-3.5">UID</th></tr>
            </thead>
            <tbody class="divide-y divide-border">
              ${users
                .map(
                  (u) => `
                  <tr>
                    <td class="p-3.5 font-medium text-ink">${escapeHTML(u.name || '—')}</td>
                    <td class="p-3.5">${escapeHTML(u.email || '—')}</td>
                    <td class="p-3.5 text-muted">${formatDate(u.createdAt)}</td>
                    <td class="p-3.5 font-mono text-[11px] text-muted">${escapeHTML(u.id)}</td>
                  </tr>
                `
                )
                .join('')}
            </tbody>
          </table>`
        : '<p class="p-8 text-sm text-muted text-center">No registered customers yet.</p>';
    });
  </script>
</body>
</html>

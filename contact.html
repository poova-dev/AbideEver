<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — AbideEver™</title>
  <link rel="icon" href="assets/images/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="max-w-4xl mx-auto w-full px-4 sm:px-6 py-12 sm:py-16">
    <p class="text-[11px] uppercase tracking-[0.18em] text-brand font-semibold mb-2">Customer Care</p>
    <h1 class="font-serif text-3xl sm:text-4xl font-semibold text-ink mb-4">Contact Us</h1>
    <p class="text-sm text-muted mb-10 max-w-xl">Have a question about sizing, orders, or collaborations? Reach out directly and our team will respond within 1–2 business days.</p>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
      <form id="contact-form" class="md:col-span-7 border border-border bg-surface p-6 sm:p-8 space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-muted mb-1.5" for="c-name">Name</label>
          <input id="c-name" type="text" required class="w-full border border-border bg-canvas px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-muted mb-1.5" for="c-email">Email</label>
          <input id="c-email" type="email" required class="w-full border border-border bg-canvas px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-muted mb-1.5" for="c-subject">Order ID / Subject</label>
          <input id="c-subject" type="text" required class="w-full border border-border bg-canvas px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-muted mb-1.5" for="c-message">Message</label>
          <textarea id="c-message" rows="4" required class="w-full border border-border bg-canvas px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand"></textarea>
        </div>
        <button type="submit" class="btn-primary px-7 py-3 text-xs uppercase tracking-[0.14em] font-semibold">Send Message</button>
      </form>

      <div class="md:col-span-5 border border-border bg-surface p-6 sm:p-8 space-y-5 self-start">
        <div>
          <p class="text-[11px] uppercase tracking-[0.14em] text-muted mb-1">Email</p>
          <p class="text-sm font-medium text-ink">care@abideever.com</p>
        </div>
        <div>
          <p class="text-[11px] uppercase tracking-[0.14em] text-muted mb-1">Support Hours</p>
          <p class="text-sm text-ink">Mon – Sat · 10:00 AM – 6:00 PM IST</p>
        </div>
        <div>
          <p class="text-[11px] uppercase tracking-[0.14em] text-muted mb-1">Order Status</p>
          <a href="order-tracking.html" class="text-sm text-brand underline">Track your order →</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module">
    import { mountHeader } from './components/header.js';
    import { mountFooter } from './components/footer.js';
    import { mountCartDrawer } from './components/cart-drawer.js';
    import { getFirebase } from './assets/js/firebase.js';
    import { showToast } from './assets/js/ui.js';

    mountHeader();
    mountFooter();
    mountCartDrawer();

    document.getElementById('contact-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const fb = await getFirebase();
        if (fb.configured) {
          const { collection, addDoc, serverTimestamp } = fb.fsMod;
          await addDoc(collection(fb.db, 'inquiries'), {
            name: document.getElementById('c-name').value.trim(),
            email: document.getElementById('c-email').value.trim(),
            subject: document.getElementById('c-subject').value.trim(),
            message: document.getElementById('c-message').value.trim(),
            createdAt: serverTimestamp(),
          });
        }
        e.target.reset();
        showToast('Message received. We will reply shortly.', { type: 'success' });
      } catch {
        showToast('Unable to send message right now', { type: 'error' });
      }
    });
  </script>
</body>
</html>
